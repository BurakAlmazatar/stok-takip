<style>
:root{
  --bg:#eceff3;--surface:#ffffff;--surface-2:#f6f7f9;--text:#16202e;--muted:#667085;--border:#dde1e8;
  --accent:#1f4fd8;--accent-ink:#ffffff;--accent-soft:#e6ecfd;
  --sale:#0f7a4a;--sale-soft:#e2f4ea;--buy:#b4540a;--buy-soft:#fdeedd;--in:#1f4fd8;--in-soft:#e6ecfd;--out:#8a2bb0;--out-soft:#f3e6f9;
  --danger:#c0262d;--danger-soft:#fde9ea;--warn:#a16207;--warn-soft:#fdf3d6;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141b;--surface:#18202b;--surface-2:#1d2733;--text:#e7ecf3;--muted:#98a3b3;--border:#2a3646;
    --accent:#6b93ff;--accent-ink:#0b1220;--accent-soft:#1b2a4d;
    --sale:#4cc38a;--sale-soft:#14301f;--buy:#f0a35e;--buy-soft:#3a2511;--in:#6b93ff;--in-soft:#1b2a4d;--out:#cf8ff0;--out-soft:#35194a;
    --danger:#ff7b82;--danger-soft:#3d1a1d;--warn:#f1c453;--warn-soft:#3a2f0e;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141b;--surface:#18202b;--surface-2:#1d2733;--text:#e7ecf3;--muted:#98a3b3;--border:#2a3646;
  --accent:#6b93ff;--accent-ink:#0b1220;--accent-soft:#1b2a4d;
  --sale:#4cc38a;--sale-soft:#14301f;--buy:#f0a35e;--buy-soft:#3a2511;--in:#6b93ff;--in-soft:#1b2a4d;--out:#cf8ff0;--out-soft:#35194a;
  --danger:#ff7b82;--danger-soft:#3d1a1d;--warn:#f1c453;--warn-soft:#3a2f0e;
  color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px 0;max-width:1100px;margin:0 auto}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.spacer{flex:1}
nav{display:flex;gap:2px;overflow-x:auto;padding:6px 12px 0;max-width:1100px;margin:0 auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;padding:9px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button:hover{color:var(--text)}
nav button.on{color:var(--accent);border-bottom-color:var(--accent)}
main{max-width:1100px;margin:0 auto;padding:16px 16px 80px}
h2{font-size:20px;margin:0;letter-spacing:-.01em}
h3{font-size:15px;margin:0 0 10px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bar .spacer{flex:1}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;border-left-width:4px}
.stat .l{font-size:13px;color:var(--muted)}
.stat .v{font-size:21px;font-weight:700;margin-top:2px;letter-spacing:-.01em}
.stat .s{font-size:12px;color:var(--muted);margin-top:2px}
.stat.sale{border-left-color:var(--sale)}.stat.buy{border-left-color:var(--buy)}.stat.in{border-left-color:var(--in)}.stat.out{border-left-color:var(--out)}.stat.warn{border-left-color:var(--warn)}.stat.neu{border-left-color:var(--border)}
.two{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:820px){.two{grid-template-columns:1.4fr 1fr}}
.btn{font:inherit;font-weight:600;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:8px 14px;border-radius:8px;cursor:pointer;min-height:38px}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.btn.sale{background:var(--sale);border-color:var(--sale);color:#fff}
.btn.buy{background:var(--buy);border-color:var(--buy);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:14px}
.card .tbl{border:0;margin:0;border-radius:0}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:13px;padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface-2)}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr[data-act]{cursor:pointer}
tbody tr[data-act]:hover td{background:var(--surface-2)}
.r{text-align:right;white-space:nowrap}
.nw{white-space:nowrap}
.muted{color:var(--muted)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.tag.sale{background:var(--sale-soft);color:var(--sale)}.tag.purchase{background:var(--buy-soft);color:var(--buy)}.tag.in{background:var(--in-soft);color:var(--in)}.tag.out{background:var(--out-soft);color:var(--out)}.tag.move{background:var(--surface-2);color:var(--muted)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.bad{background:var(--danger-soft);color:var(--danger)}
.pos{color:var(--sale);font-weight:600}.neg{color:var(--danger);font-weight:600}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;width:100%;min-height:38px}
textarea{resize:vertical}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:10px}
label.f>input,label.f>select,label.f>textarea{margin-top:4px;font-weight:400}
.cols{display:grid;gap:0 12px;grid-template-columns:1fr 1fr}
.search{max-width:300px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--border);background:var(--surface);color:var(--muted);padding:5px 12px;border-radius:99px;cursor:pointer}
.chip.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.lines{display:grid;gap:8px}
.line{display:grid;gap:8px;grid-template-columns:1fr 90px 110px 110px 34px;align-items:start;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2)}
.line .lt{text-align:right;font-weight:600;padding-top:9px}
.line .wn{font-size:12px;margin-top:3px}
.line .x{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;padding:6px}
.line .x:hover{color:var(--danger)}
@media(max-width:620px){
  .line{grid-template-columns:1fr 1fr 34px}
  .line .pc{grid-column:1/-1}
  .line .lt{grid-column:1/3;text-align:left;padding-top:0}
  .cols{grid-template-columns:1fr}
}
.totals{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end;margin-top:14px}
.totals .big{font-size:24px;font-weight:700}
.bars{display:flex;align-items:flex-end;gap:5px;height:130px;padding-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10px;color:var(--muted);gap:4px}
.bars i{display:block;width:100%;background:var(--sale);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.modal{position:fixed;inset:0;background:rgba(10,15,25,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal[hidden]{display:none}
@media(min-width:640px){.modal{align-items:center;padding:20px}}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
@media(min-width:640px){.sheet{border-radius:14px}}
.sheet.wide{max-width:680px}
.sheet h3{font-size:17px;margin-bottom:14px}
.row-end{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;flex-wrap:wrap}
.hint{font-size:13px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:12px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:60;max-width:90vw}
#toast.err{background:var(--danger);color:#fff}
#toast[hidden]{display:none}
.legend{font-size:13px;color:var(--muted);margin:-4px 0 12px}
.top .spacer{display:none}
.cols3{display:grid;gap:0 12px;grid-template-columns:repeat(3,1fr)}
@media(max-width:480px){.cols3{grid-template-columns:1fr}}
.tag.sret{background:var(--danger-soft);color:var(--danger)}
.tag.pret{background:var(--warn-soft);color:var(--warn)}
.chips .sm{margin:0}
.line .ld{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.line .ld select{width:64px;min-height:34px;padding:4px 6px}
.line .ld input{width:96px;min-height:34px;padding:4px 8px}
.ddisc{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
.ddisc select{width:64px}
.ddisc input{width:110px}
.scanrow{margin-bottom:10px}
.bcrow{display:flex;gap:6px}
.bcrow .btn{white-space:nowrap}
#logo{display:flex;align-items:center}
.logo{height:32px;max-width:140px;object-fit:contain;background:#fff;border-radius:6px;padding:2px 6px;vertical-align:middle}
.login .logo{display:block;margin:0 auto 14px;height:56px;max-width:220px}
.chk{display:inline-flex;gap:5px;align-items:center;font-size:13px;color:var(--muted);font-weight:600}
.permgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.pgrp{border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:var(--surface-2)}
.pgt{font-weight:700;font-size:13px;margin-bottom:4px}
.chk.pk{display:flex;align-items:flex-start;gap:6px;font-weight:400;color:var(--text);margin:3px 0;font-size:13px}
.chk.pk input{margin-top:2px}
.chk input{width:auto;min-height:0}
#usr{margin-left:auto}
.usr{font:inherit;font-weight:600;border:1px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:99px;padding:5px 12px;cursor:pointer}
.login{max-width:380px;margin:36px auto}
.err-t{color:var(--danger);font-size:13px;min-height:18px;margin:-4px 0 8px}
.rcpt{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;line-height:1.4;background:#fff;color:#000;border:1px dashed #999;padding:14px 12px;width:302px;max-width:100%;margin:0 auto 12px}
.rcpt h4{margin:0 0 2px;font-size:15px;text-align:center}
.rcpt .c{text-align:center}
.rcpt hr{border:0;border-top:1px dashed #000;margin:7px 0}
.rcpt .rr{display:flex;justify-content:space-between;gap:8px}
.rcpt .b{font-weight:700;font-size:14px}
@page{size:80mm auto;margin:3mm}
@media print{
  body{background:#fff}
  body::before,header,main,#toast{display:none!important}
  #modal{position:static;background:none;display:block;padding:0}
  .sheet{max-width:none;max-height:none;overflow:visible;padding:0;background:none;border-radius:0}
  .sheet h3,.row-end{display:none!important}
  .rcpt{border:0;width:100%;padding:0;margin:0}
}
</style>
</head>
<body>
<header>
  <div class="top">
    <span id="logo"></span><div class="brand"><span id="biz">Stok ve Cari Takip</span><small>Satış, alış, stok ve cari hesaplar</small></div><span id="usr"></span>
    <span class="spacer"></span>
  </div>
  <nav id="nav"></nav>
</header>
<main id="app"></main>
<div class="modal" id="modal" hidden></div>
<div id="toast" hidden></div>

<script>
/* ---------- Veri ---------- */
var KEY = 'stokcari_v1';
function defaults(){ return {products:[],caris:[],docs:[],payments:[],moves:[],counters:{sale:0,purchase:0},seq:1,users:[],campaigns:[],settings:{name:'',phone:'',address:'',taxNo:'',footer:'',logo:'',logoRcpt:false,attrVals:[[],[],[],[],[]]}}; }
function load(){
  try{ var s = localStorage.getItem(KEY); if(s){ var o = JSON.parse(s); return Object.assign(defaults(), o); } }catch(e){}
  return defaults();
}
var db = load();
ensureAttrVals();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ toast('Veri kaydedilemedi. Tarayıcı depolama alanı dolu olabilir, yedek alın.', 'err'); } }
function uid(){ return 'i' + (db.seq++).toString(36) + Date.now().toString(36).slice(-4); }

/* ---------- Oturum ve yetki ---------- */
var SESS = 'stokcari_sess';
var sessId = '';
try{ sessId = sessionStorage.getItem(SESS) || ''; }catch(e){}
function cur(){ return db.users.find(function(u){ return u.id === sessId && u.active !== false; }); }
function setSess(id){ sessId = id || ''; try{ if(id) sessionStorage.setItem(SESS, id); else sessionStorage.removeItem(SESS); }catch(e){} }
/* Menü ve işlem bazlı yetkiler. Yönetici rolü her şeye sahiptir; personelin yetkileri kullanıcı bazında seçilir. */
var PERMS = [
  {id:'panel', label:'Panel', items:[['view', 'Menüyü görebilir'], ['cash', 'Kasa bilgilerini görebilir (kasa, bugünkü kasa)']]},
  {id:'sales', label:'Satış', items:[['view', 'Menüyü ve geçmiş satışları görebilir'], ['new', 'Yeni satış yapabilir'], ['discount', 'İskonto girebilir (satır ve genel)'], ['price', 'Satışta birim fiyatı değiştirebilir'], ['refund', 'Satış iadesi yapabilir'], ['delete', 'Satış ve satış iadesi kaydını silebilir']]},
  {id:'purchases', label:'Alış', items:[['view', 'Menüyü ve geçmiş alışları görebilir'], ['new', 'Yeni alış yapabilir'], ['refund', 'Alış iadesi yapabilir'], ['delete', 'Alış ve alış iadesi kaydını silebilir']]},
  {id:'products', label:'Ürünler', items:[['view', 'Menüyü ve ürün kartlarını görebilir'], ['edit', 'Ürün ekleyip düzenleyebilir'], ['delete', 'Ürün silebilir'], ['import', 'Excel’den toplu aktarım yapabilir'], ['labels', 'Barkod ve etiket işlemleri yapabilir (etiket, toplu etiket, otomatik barkod)']]},
  {id:'attrs', label:'Özellikler', items:[['view', 'Menüyü görebilir'], ['edit', 'Özellik adlarını ve değerlerini değiştirebilir']]},
  {id:'campaigns', label:'Kampanyalar', items:[['view', 'Menüyü görebilir'], ['edit', 'Kampanya ekleyip düzenleyebilir, silebilir']]},
  {id:'stock', label:'Stok', items:[['view', 'Menüyü, stok ve hareketleri görebilir'], ['move', 'Elle stok girişi ve çıkışı yapabilir'], ['delete', 'Elle girilmiş stok hareketini silebilir']]},
  {id:'caris', label:'Cariler', items:[['view', 'Menüyü, bakiye ve ekstreleri görebilir'], ['add', 'Cari ekleyebilir'], ['edit', 'Cari düzenleyebilir'], ['delete', 'Cari silebilir']]},
  {id:'payments', label:'Tahsilat / Ödeme', items:[['view', 'Menüyü ve kayıtları görebilir'], ['collect', 'Tahsilat alabilir'], ['payout', 'Cariye ödeme yapabilir'], ['delete', 'Tahsilat ve ödeme kaydını silebilir']]},
  {id:'reports', label:'Raporlar', items:[['view', 'Menüyü ve raporları görebilir'], ['profit', 'Kâr bilgilerini görebilir']]},
  {id:'payrep', label:'Ödeme Raporu', items:[['view', 'Menüyü ve raporu görebilir']]},
  {id:'settings', label:'Ayarlar', items:[['view', 'Menüyü görebilir (tema)'], ['edit', 'Firma bilgilerini ve logoyu değiştirebilir']]},
  {id:'cost', label:'Maliyet bilgisi', items:[['view', 'Alış fiyatlarını ve stok değerini görebilir']]}
];
var PERM_ALIAS = {cost:'cost.view', stockmove:'stock.move', payout:'payments.payout', collect:'payments.collect', addCari:'caris.add', sell:'sales.new', refund:'sales.refund', buy:'purchases.new'};
var PERM_TPL = {
  kasiyer:['panel.view', 'sales.view', 'sales.new', 'sales.refund', 'products.view', 'stock.view', 'caris.view', 'caris.add', 'payments.view', 'payments.collect'],
  satis:['panel.view', 'sales.view', 'sales.new', 'sales.discount', 'sales.price', 'sales.refund', 'products.view', 'campaigns.view', 'stock.view', 'caris.view', 'caris.add', 'payments.view', 'payments.collect'],
  depo:['panel.view', 'products.view', 'products.edit', 'products.import', 'products.labels', 'attrs.view', 'stock.view', 'stock.move', 'purchases.view', 'purchases.new', 'purchases.refund', 'cost.view'],
  muhasebe:['panel.view', 'panel.cash', 'sales.view', 'purchases.view', 'caris.view', 'payments.view', 'payments.collect', 'payments.payout', 'reports.view', 'reports.profit', 'payrep.view', 'cost.view']
};
function allPerms(){ var a = []; PERMS.forEach(function(g){ g.items.forEach(function(it){ a.push(g.id + '.' + it[0]); }); }); return a; }
function legacyStaffPerms(){
  var a = ['panel.view', 'sales.view', 'sales.new', 'sales.discount', 'sales.price', 'products.view', 'stock.view', 'caris.view', 'caris.add', 'payments.view', 'payments.collect'];
  if(!(db.settings && db.settings.staffRefund === false)) a.push('sales.refund');
  return a;
}
function normPerms(arr){
  var set = {}; arr.forEach(function(k){ set[k] = 1; });
  PERMS.forEach(function(g){
    if(g.id === 'cost' || !g.items.some(function(it){ return it[0] === 'view'; })) return;
    if(g.items.some(function(it){ return it[0] !== 'view' && set[g.id + '.' + it[0]]; })) set[g.id + '.view'] = 1;
  });
  var all = allPerms();
  return Object.keys(set).filter(function(k){ return all.indexOf(k) >= 0; });
}
function ensureUserPerms(){ db.users.forEach(function(u){ if(u.role !== 'admin' && !Array.isArray(u.perms)) u.perms = legacyStaffPerms(); }); }
function can(a){
  var u = cur(); if(!u) return false;
  if(u.role === 'admin') return true;
  if(a === 'receipt') return true;
  if(a === 'admin') return false;
  a = PERM_ALIAS[a] || a;
  return (u.perms || legacyStaffPerms()).indexOf(a) >= 0;
}
function tabOk(t){ return can(t + '.view'); }
var DOC_PERM = {sale:'sales.new', purchase:'purchases.new', sret:'sales.refund', pret:'purchases.refund'};
var DOC_DEL = {sale:'sales.delete', sret:'sales.delete', purchase:'purchases.delete', pret:'purchases.delete'};
var DOC_VIEW = {sale:'sales.view', sret:'sales.view', purchase:'purchases.view', pret:'purchases.view'};
var ACT_PERM = {
  newProduct:'products.edit', editProduct:'products.edit', genEan:'products.edit', delProduct:'products.delete',
  label:'products.labels', batchLabels:'products.labels', autoBarcodes:'products.labels', lblAll:'products.labels', lblStock:'products.labels', bulkBarcode:'products.labels', bbAll:'products.labels', bbLabels:'products.labels',
  impExcel:'products.import', impTemplate:'products.import',
  stockMove:'stock.move', delMove:'stock.delete',
  newCari:'caris.add', quickCari:'caris.add', editCari:'caris.edit', delCari:'caris.delete',
  delPay:'payments.delete',
  repPreset:'reports.view', repType:'reports.view', copyRep:'reports.view', repMethod:'payrep.view', copyPay:'payrep.view',
  newCamp:'campaigns.edit', editCamp:'campaigns.edit', togCamp:'campaigns.edit', delCamp:'campaigns.edit',

  });
  var total = pr.total;
  var pays = {};
  if(o.pays){ Object.keys(o.pays).forEach(function(m){ var v = r2(num(o.pays[m])); if(v > 0) pays[m] = v; }); }
  else if(num(o.paid) > 0){ pays['Nakit'] = r2(num(o.paid)); }
  var paid = r2(sum(Object.keys(pays), function(m){ return pays[m]; }));
  var doc = {id:uid(), no:no, type:o.type, date:o.date, cariId:o.cariId || '', lines:lines, total:total, gross:pr.gross, docDisc:pr.docDisc, paid:paid, pays:pays, note:o.note || '', by:(cur() || {}).id || '', ts:Date.now() + db.seq};
  db.docs.push(doc);
  lines.forEach(function(l){
    db.moves.push({id:uid(), pid:l.pid, qty:T.stock * l.qty, date:o.date, reason:KIND[o.type], ref:doc.id, no:no, ts:doc.ts});
    if(o.type === 'purchase' && l.cost > 0){ var p = prod(l.pid); if(p) p.cost = l.cost; }
  });
  return doc;
}

/* Stok */
/* Stok: arama + özellik/durum süzgeçleri (ürün listesi ve hareketler birlikte süzülür) */
function stockMatch(p){
  var f = state.sq, q = nz(f.q);
  if(q && nz(p.name + ' ' + (p.code || '') + ' ' + (p.barcode || '') + ' ' + attrText(p)).indexOf(q) < 0) return false;
  for(var i = 0; i < 5; i++){ if(f.attrs[i] && (p.attrs || [])[i] !== f.attrs[i]) return false; }
  if(f.st){
    var s = stockOf(p.id);
    if(f.st === 'crit' && !(p.min > 0 && s <= p.min)) return false;
    if(f.st === 'zero' && !(s <= 0)) return false;
    if(f.st === 'neg' && !(s < 0)) return false;
  }
  return true;
}
function stockFiltersOn(){ var f = state.sq; return !!(nz(f.q) || f.attrs.some(Boolean) || f.st); }
function stockFilters(){
  var f = state.sq, names = attrNames();
  var selA = names.map(function(n, i){
    if(!n || !attrVals(i).length) return '';
    return '<select data-sf="' + i + '" style="max-width:210px"><option value="">' + esc(n) + ': hepsi</option>' + attrVals(i).map(function(v){ return '<option value="' + esc(v.c) + '"' + (f.attrs[i] === v.c ? ' selected' : '') + '>' + esc(v.c) + (v.d && v.d !== v.c ? ' – ' + esc(v.d) : '') + '</option>'; }).join('') + '</select>';
  }).join('');
  var st = '<select data-sf="st" style="max-width:200px"><option value="">Stok durumu: hepsi</option><option value="crit"' + (f.st === 'crit' ? ' selected' : '') + '>Kritik seviye ve altı</option><option value="zero"' + (f.st === 'zero' ? ' selected' : '') + '>Stoksuz veya eksi</option><option value="neg"' + (f.st === 'neg' ? ' selected' : '') + '>Yalnızca eksi stok</option></select>';
  return '<div class="card" style="padding:10px"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input id="stq" type="search" style="flex:1;min-width:220px" placeholder="Ürün adı, kod, barkod veya özellik ara" value="' + esc(f.q) + '" autocomplete="off">' + selA + st + '<button class="btn sm" data-act="stClear">Temizle</button></div></div>';
}
function stockSub(p){
  var bits = [p.code, p.barcode].filter(Boolean).map(esc).join(' · '), tg = attrTags(p);
  return (bits ? '<div class="muted" style="font-size:12px">' + bits + '</div>' : '') + (tg ? '<div style="margin-top:2px">' + tg + '</div>' : '');
}
function stockTable(){
  if(!db.products.length) return '<div class="empty">Önce ürün kartı açın.</div>';
  var ps = db.products.filter(stockMatch).sort(function(a, b){ return a.name.localeCompare(b.name, 'tr'); });
  if(!ps.length) return '<div class="empty">Aramanıza uyan ürün yok.</div>';
  var val = sum(ps, function(p){ return stockOf(p.id) * p.cost; });
  return '<div class="muted" style="margin-bottom:6px">' + ps.length + ' ürün' + (can('cost') ? ' · toplam stok değeri ' + money(val) : '') + '</div>' +
    '<div class="tbl"><table><thead><tr><th>Ürün</th><th class="r">Stok</th>' + (can('cost') ? '<th class="r">Stok değeri (alış)</th>' : '') + '<th></th></tr></thead><tbody>' + ps.map(function(p){
      var s = stockOf(p.id);
      return '<tr><td>' + esc(p.name) + stockSub(p) + '</td><td class="r"><span class="tag ' + (s <= 0 ? 'bad' : (p.min > 0 && s <= p.min) ? 'warn' : 'move') + '">' + qf(s) + ' ' + esc(p.unit) + '</span></td>' + (can('cost') ? '<td class="r">' + money(s * p.cost) + '</td>' : '') + '<td class="r">' + (can('stockmove') ? '<button class="btn sm" data-act="stockMove" data-dir="in" data-pid="' + p.id + '">Giriş</button> <button class="btn sm" data-act="stockMove" data-dir="out" data-pid="' + p.id + '">Çıkış</button>' : '') + '</td></tr>';
    }).join('') + '</tbody></table></div>';
}
function stockMoves(){
  var on = stockFiltersOn();
  var mv = db.moves.filter(function(m){ var p = prod(m.pid); return p ? stockMatch(p) : !on; }).sort(function(a, b){ return b.date.localeCompare(a.date) || b.ts - a.ts; });
  var shown = mv.slice(0, 100);
  if(!shown.length) return '<div class="empty">' + (on ? 'Aramanıza uyan hareket yok.' : 'Hareket yok.') + '</div>';
  return '<div class="tbl"><table><thead><tr><th>Tarih</th><th>Ürün</th><th>Neden</th><th class="r">Miktar</th><th></th></tr></thead><tbody>' + shown.map(function(m){
    var p = prod(m.pid);
    return '<tr><td class="nw">' + fd(m.date) + '</td><td>' + esc(p ? p.name : '(silinmiş ürün)') + (p && (p.code || p.barcode) ? '<div class="muted" style="font-size:12px">' + [p.code, p.barcode].filter(Boolean).map(esc).join(' · ') + '</div>' : '') + '</td><td>' + esc(m.reason) + (m.no ? ' <span class="muted">' + esc(m.no) + '</span>' : '') + (m.note ? ' <span class="muted">· ' + esc(m.note) + '</span>' : '') + (m.by ? ' <span class="muted">· ' + esc(userName(m.by)) + '</span>' : '') + '</td><td class="r ' + (m.qty > 0 ? 'pos' : 'neg') + '">' + (m.qty > 0 ? '+' : '') + qf(m.qty) + '</td><td class="r">' + (m.ref || !can('stock.delete') ? '' : '<button class="btn sm danger" data-act="delMove" data-id="' + m.id + '">Sil</button>') + '</td></tr>';
  }).join('') + '</tbody></table></div>' + (mv.length > shown.length ? '<div class="muted">İlk 100 hareket gösteriliyor, toplam ' + mv.length + ' hareket var. Aramayı daraltın.</div>' : '');
}

      db.payments.push({id:uid(), cariId:f.cariId, dir:dir, amount:r2(a), date:f.date || today(), method:f.method, note:f.note.trim(), by:(cur() || {}).id || '', ts:Date.now()});
      commit(); toast(isIn ? 'Tahsilat kaydedildi' : 'Ödeme kaydedildi');
    }, 'Kaydet');
}

/* Raporlar */
function repData(){
  var r = state.rep, ok = function(d){ return (!r.from || d >= r.from) && (!r.to || d <= r.to); };
  var uok = function(x){ return !r.user || x.by === r.user; };
  var docs = db.docs.filter(function(d){ return ok(d.date) && uok(d); });
  var pays = db.payments.filter(function(p){ return ok(p.date) && uok(p); });
  return {docs:docs, pays:pays};
}
function repTx(){
  var d = repData(), rows = [];
  d.docs.forEach(function(x){ rows.push({date:x.date, ts:x.ts, kind:x.type, no:x.no, who:x.cariId, amt:x.total, paid:x.paid, rest:r2(x.total - x.paid), by:x.by}); });
  d.pays.forEach(function(p){ rows.push({date:p.date, ts:p.ts, kind:p.dir, no:'—', who:p.cariId, amt:p.amount, paid:p.amount, rest:0, by:p.by}); });
  rows.sort(function(a, b){ return b.date.localeCompare(a.date) || b.ts - a.ts; });

}

V.reports = function(){
  var r = state.rep, d = repData();

  var sales = of('sale'), srets = of('sret'), buys = of('purchase'), prets = of('pret');
  var tot = function(a){ return sum(a, function(x){ return x.total; }); };
  var vt = function(a){ return sum(a, function(x){ return vatSplit(x.lines).vat; }); };
  var nt = function(a){ return sum(a, function(x){ return vatSplit(x.lines).net; }); };
  var pf = function(a){ return sum(a, function(x){ return sum(x.lines, function(l){ return (lt(l) - l.qty * l.cost) / (1 + num(l.vat) / 100); }); }); };
  var sT = tot(sales) - tot(srets), bT = tot(buys) - tot(prets);
  var profit = pf(sales) - pf(srets), sNet = nt(sales) - nt(srets);
  var sV = vt(sales) - vt(srets), bV = vt(buys) - vt(prets);
  var dsum = {c:0, m:0, g:0}, cmp = {};
  d.docs.forEach(function(x){
    if(x.type !== 'sale' && x.type !== 'sret') return;

    x.lines.forEach(function(l){
      dsum.c += sgn * num(l.cDisc); dsum.m += sgn * num(l.mDisc); dsum.g += sgn * num(l.gDisc);
      if(num(l.cDisc) > 0 && l.camp){ var o = cmp[l.camp] || (cmp[l.camp] = {n:0, d:0}); o.n += sgn; o.d += sgn * num(l.cDisc); }
    });
  });
  var k = cash(r.from, r.to, r.user);
  var pm = {};
  d.docs.forEach(function(x){ x.lines.forEach(function(l){
    var o = pm[l.pid] || (pm[l.pid] = {sq:0, sr:0, sp:0, bq:0, br:0});
    var g = lt(l), pr = (lt(l) - l.qty * l.cost) / (1 + num(l.vat) / 100);
    if(x.type === 'sale'){ o.sq += l.qty; o.sr += g; o.sp += pr; }
    else if(x.type === 'sret'){ o.sq -= l.qty; o.sr -= g; o.sp -= pr; }
    else if(x.type === 'purchase'){ o.bq += l.qty; o.br += g; }
    else { o.bq -= l.qty; o.br -= g; }
  }); });
  var prows = Object.keys(pm).map(function(id){ return {p:prod(id), o:pm[id]}; }).sort(function(a, b){ return b.o.sr - a.o.sr; });
  var cm = {};
  d.docs.forEach(function(x){
    if(!x.cariId) return;
    var o = cm[x.cariId] || (cm[x.cariId] = {s:0, b:0, p:0});
    if(x.type === 'sale') o.s += x.total; else if(x.type === 'sret') o.s -= x.total; else if(x.type === 'purchase') o.b += x.total; else o.b -= x.total;

  var crows = Object.keys(cm).map(function(id){ return {id:id, o:cm[id]}; }).sort(function(a, b){ return (b.o.s + b.o.b) - (a.o.s + a.o.b); });

    '<div class="stat buy"><div class="l">Net alış (iade düşülmüş)</div><div class="v">' + money(bT) + '</div><div class="s">' + buys.length + ' alış' + (prets.length ? ' · ' + prets.length + ' iade (' + money(tot(prets)) + ')' : '') + '</div></div>' +
    (can('reports.profit') ? '<div class="stat sale"><div class="l">Brüt kâr (tahmini)</div><div class="v">' + money(profit) + '</div><div class="s">' + (sNet > 0 ? 'KDV hariç, %' + (profit / sNet * 100).toFixed(1).replace('.', ',') + ' marj' : 'Satış yok') + '</div></div>' : '') +
    '<div class="stat in"><div class="l">Kasa girişi</div><div class="v">' + money(k.inn) + '</div></div>' +
    '<div class="stat out"><div class="l">Kasa çıkışı</div><div class="v">' + money(k.out) + '</div></div>' +
    '<div class="stat neu"><div class="l">Net kasa</div><div class="v">' + money(k.net) + '</div><div class="s">Nakit, kart ve havale dağılımı için Ödeme Raporu sekmesi</div></div>' +
    '<div class="stat sale"><div class="l">Hesaplanan KDV (satış)</div><div class="v">' + money(sV) + '</div></div>' +
    '<div class="stat buy"><div class="l">İndirilecek KDV (alış)</div><div class="v">' + money(bV) + '</div></div>' +
    '<div class="stat neu"><div class="l">Ödenecek KDV (net)</div><div class="v">' + money(sV - bV) + '</div></div>' +
  '</div>' +
  '<h3>İskonto ve kampanya özeti (satışlar)</h3><div class="grid">' +
    '<div class="stat sale"><div class="l">Kampanya indirimi</div><div class="v">' + money(r2(dsum.c)) + '</div></div>' +
    '<div class="stat sale"><div class="l">Manuel iskonto (satır)</div><div class="v">' + money(r2(dsum.m)) + '</div></div>' +
    '<div class="stat sale"><div class="l">Genel iskonto</div><div class="v">' + money(r2(dsum.g)) + '</div></div>' +
    '<div class="stat neu"><div class="l">Toplam indirim</div><div class="v">' + money(r2(dsum.c + dsum.m + dsum.g)) + '</div></div></div>' +
  (Object.keys(cmp).length ? '<div class="tbl"><table><thead><tr><th>Kampanya</th><th class="r">Uygulanan satır</th><th class="r">Verilen indirim</th></tr></thead><tbody>' + Object.keys(cmp).map(function(k){ return '<tr><td>' + esc(k) + '</td><td class="r">' + cmp[k].n + '</td><td class="r">' + money(r2(cmp[k].d)) + '</td></tr>'; }).join('') + '</tbody></table></div>' : '') +

    var u = x.p ? x.p.unit : '';
    return '<tr><td>' + esc(x.p ? x.p.name : '(silinmiş)') + '</td><td class="r">' + qf(x.o.sq) + ' ' + esc(u) + '</td><td class="r">' + money(x.o.sr) + '</td>' + (can('reports.profit') ? '<td class="r">' + money(x.o.sp) + '</td>' : '') + '<td class="r">' + qf(x.o.bq) + ' ' + esc(u) + '</td><td class="r">' + money(x.o.br) + '</td></tr>';
  }).join('') + '</tbody></table></div>' : '<div class="empty">Bu aralıkta ürün hareketi yok.</div>') +
  '<h3>Cari bazlı</h3>' + (crows.length ? '<div class="tbl"><table><thead><tr><th>Cari</th><th class="r">Net satış</th><th class="r">Net alış</th><th class="r">Tahsilat / ödeme</th><th class="r">Güncel bakiye</th></tr></thead><tbody>' + crows.map(function(x){

A.saveDoc = function(d){
  var type = d.type, ed = state.ed[type];
  if(!can(DOC_PERM[type])){ toast('Bu işlem için yetkiniz yok', 'err'); return; }
  if(type === 'sale'){
    if(!can('sales.discount')){ ed.lines.forEach(function(l){ l.disc = null; }); ed.docDisc = null; }
    if(!can('sales.price')){ ed.lines.forEach(function(l){ var p0 = prod(l.pid); if(p0) l.price = p0.price; }); }
  }
  var pr = edPricing(type, ed);
  if(!pr.lines.length){ toast('En az bir ürün ve miktar girin', 'err'); return; }
  var total = pr.total;
  var pays = {};
  ['n', 'k', 'h'].forEach(function(k){ var v = r2(num(ed.pay[k])); if(v > 0) pays[PKEY[k]] = v; });
  var paid = r2(sum(Object.keys(pays), function(m){ return pays[m]; }));
  if(paid > total + 0.004){ toast('Ödeme toplamı fiş tutarını aşıyor', 'err'); return; }
  if(!ed.cariId && paid < total - 0.004){ toast('Cari seçmeden kalan tutar bırakılamaz. Cari seçin ya da tamamını ödeme olarak girin.', 'err'); return; }
  var nd = createDoc({type:type, date:ed.date || today(), cariId:ed.cariId, lines:ed.lines, docDisc:ed.docDisc, pays:pays, note:ed.note});
  state.ed[type] = null; commit(); toast(KIND[type] + ' kaydedildi');
  if(type === 'sale' || type === 'sret') A.receipt({kind:'doc', id:nd.id});
};

function restoreBackup(txt, skipConfirm){
  txt = String(txt || '').replace(/^\uFEFF/, '').trim();
  if(!txt){ toast('Yedek boş görünüyor', 'err'); return; }
  var o; try{ o = JSON.parse(txt); }catch(e){ toast('Yedek okunamadı. Doğru dosyayı seçtiğinizden emin olun.', 'err'); return; }
  if(!o || !Array.isArray(o.products) || !Array.isArray(o.docs)){ toast('Bu dosya geçerli bir yedek değil', 'err'); return; }
  var go = function(){ db = Object.assign(defaults(), o); ensureAttrVals(); ensureUserPerms(); if(!cur()) setSess(''); commit(); toast('Yedek yüklendi'); };
  if(skipConfirm) go(); else confirmBox('Mevcut veriler silinip yedek geri yüklenecek.', go, 'Geri yükle');
}
function readBackupFile(file, fromSetup){
  if(!file) return;
  if(file.size > 30 * 1024 * 1024){ toast('Dosya çok büyük', 'err'); return; }
  var fr = new FileReader();
  fr.onerror = function(){ toast('Dosya okunamadı', 'err'); };
  fr.onload = function(){
    var txt = String(fr.result || '');
    if(fromSetup) restoreBackup(txt, !(db.products.length || db.docs.length));
    else { var ta = $('#bk'); if(ta) ta.value = txt; restoreBackup(txt, false); }
  };
  fr.readAsText(file);
}
A.importData = function(){

function curTheme(){

}

document.addEventListener('click', function(e){
  if(e.target.id === 'modal'){ closeModal(); return; }
  var b = e.target.closest('[data-act]'); if(!b) return;
  var act = b.dataset.act;
  if(!cur() && act !== 'closeModal') return;
  var need = ACT_PERM[act];
  if(need && !can(need)){ toast('Bu işlem için yetkiniz yok', 'err'); return; }
  var fn = A[act]; if(fn){ e.preventDefault(); fn(b.dataset, b); }
});
function onEd(e){
  var t = e.target, type = t.dataset.ed; if(!type) return;
  var ed = state.ed[type]; if(!ed) return;
  var f = t.dataset.f;
  if(t.dataset.i !== undefined){
    var l = ed.lines[+t.dataset.i];
    if(f === 'dt' || f === 'dv'){ l.disc = l.disc || {t:'%', v:''}; l.disc[f === 'dt' ? 't' : 'v'] = t.value; }
    else {
      l[f] = t.value;
      if(f === 'pid'){ var p = prod(t.value); if(p) l.price = TYPES[type].sellSide ? p.price : p.cost; l.noCamp = false; render(); return; }
    }
  } else if(f.indexOf('pay_') === 0){
    ed.pay[f.slice(4)] = t.value; ed.pm = null;
  } else if(f === 'ddt' || f === 'ddv'){
    ed.docDisc = ed.docDisc || {t:'%', v:''}; ed.docDisc[f === 'ddt' ? 't' : 'v'] = t.value;
  } else {
    ed[f] = t.value;
    if(f === 'cariId' || f === 'note') return;
  }
  updateTotals(type);
}
document.addEventListener('keydown', function(e){
  var t = e.target;
  if(!t.dataset || !t.dataset.scan || e.key !== 'Enter') return;
  e.preventDefault();
  var code = t.value.trim(); if(!code) return;
  var type = t.dataset.scan, ed = state.ed[type]; if(!ed) return;
  var lc = code.toLowerCase();
  var p = db.products.find(function(x){ return (x.barcode && x.barcode.toLowerCase() === lc) || (x.code && x.code.toLowerCase() === lc); });
  if(!p){ toast('Barkod veya kod bulunamadı: ' + code, 'err'); t.select(); return; }
  var ex = ed.lines.find(function(l){ return l.pid === p.id; });
  if(ex){ ex.qty = String(num(ex.qty) + 1); }
  else {
    var price = TYPES[type].sellSide ? p.price : p.cost;
    var blank = ed.lines.find(function(l){ return !l.pid; });
    if(blank){ blank.pid = p.id; blank.qty = 1; blank.price = price; blank.noCamp = false; }
    else ed.lines.push({pid:p.id, qty:1, price:price});
  }
  render();
  var n = $('#scan'); if(n) n.focus();
  toast(p.name + ' eklendi');
});
document.addEventListener('input', function(e){

  if(t.id === 'stq'){ state.sq.q = t.value; stRefresh(); return; }
  if(t.id === 'bbq'){ bbFilter(); return; }

});
document.addEventListener('change', function(e){
  var t = e.target;
  if(t.dataset.rep){ state.rep[t.dataset.rep] = t.value; render(); return; }
  if(t.dataset.sf !== undefined){ if(t.dataset.sf === 'st') state.sq.st = t.value; else state.sq.attrs[+t.dataset.sf] = t.value; stRefresh(); return; }
  if(t.dataset.sp){ state.stockPid = t.value; render(); return; }
  if(t.id === 'bkfile' || t.id === 'bkfile2'){
    var allowed = t.id === 'bkfile2' ? !db.users.length : can('admin');
    if(allowed) readBackupFile(t.files && t.files[0], t.id === 'bkfile2');
    t.value = ''; return;
  }
  if(t.id === 'logofile'){ if(can('settings.edit')) loadLogo(t.files && t.files[0]); t.value = ''; return; }
  if(t.dataset.pk){ permSync(t); return; }
  if(t.name === 'role' && $('#permbox')){ $('#permbox').hidden = t.value === 'admin'; return; }
  if(t.id === 'logoRcpt'){ if(can('settings.edit')){ db.settings.logoRcpt = t.checked; save(); } return; }
  if(t.id === 'staffRefund'){ db.settings.staffRefund = t.checked; commit(); toast(t.checked ? 'Personel satış iadesi yapabilir' : 'Satış iadesi yalnızca yöneticide'); return; }
  if(t.dataset.bbf !== undefined){ bbFilter(); return; }
  if(t.dataset.lblf !== undefined){ lblFilter(); return; }
  if((t.name === 'type' || t.name === 'scope' || t.name === 'ai') && $('#mf')) campToggle();
  if(t.tagName === 'SELECT') onEd(e);
});

function parseDelimited(text){

  ['\t', ';', ','].forEach(function(dl){ var n = first.split(dl).length - 1; if(n > bc){ bc = n; best = dl; } });
  var rows = [], row = [], cell = '', q = false;
  for(var i = 0; i < text.length; i++){
    var ch = text[i];
    if(q){ if(ch === '"'){ if(text[i + 1] === '"'){ cell += '"'; i++; } else q = false; } else cell += ch; }
    else if(ch === '"' && cell === ''){ q = true; }
    else if(ch === best){ row.push(cell); cell = ''; }
    else if(ch === '\n' || ch === '\r'){ if(ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }

/* .xlsx okuyucu: zip + XML, harici kütüphane gerektirmez */
function zipIndex(buf){
  var u8 = new Uint8Array(buf), dv = new DataView(buf), e = -1, i;
  for(i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--){ if(dv.getUint32(i, true) === 0x06054b50){ e = i; break; } }
  if(e < 0) throw new Error('zip');
  var n = dv.getUint16(e + 10, true), p = dv.getUint32(e + 16, true), files = {};
  for(var k = 0; k < n; k++){
    if(dv.getUint32(p, true) !== 0x02014b50) throw new Error('zip');
    var nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
    var name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nl));
    files[name] = {method:dv.getUint16(p + 10, true), csize:dv.getUint32(p + 20, true), lho:dv.getUint32(p + 42, true)};
    p += 46 + nl + el + cl;
  }
  return files;
}
async function zipGet(buf, files, name){
  var f = files[name]; if(!f) return null;
  var dv = new DataView(buf), u8 = new Uint8Array(buf), p = f.lho;
  var start = p + 30 + dv.getUint16(p + 26, true) + dv.getUint16(p + 28, true);
  var data = u8.subarray(start, start + f.csize);
  if(f.method === 0) return data;
  if(f.method !== 8) throw new Error('zip');
  var rs = new ReadableStream({start:function(c){ c.enqueue(data); c.close(); }}).pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(rs).arrayBuffer());
}

  var sheetPath = 'xl/worksheets/sheet1.xml';
  var wbx = await zipGet(buf, files, 'xl/workbook.xml'), rels = await zipGet(buf, files, 'xl/_rels/workbook.xml.rels');
  if(wbx && rels){
    var sh = parse(wbx).getElementsByTagName('sheet')[0], rid = sh && sh.getAttribute('r:id'), rs = parse(rels).getElementsByTagName('Relationship');
    for(var i = 0; i < rs.length; i++){ if(rid && rs[i].getAttribute('Id') === rid){ var tg = rs[i].getAttribute('Target'); sheetPath = tg.charAt(0) === '/' ? tg.slice(1) : 'xl/' + tg; } }
  }
  var sx = await zipGet(buf, files, sheetPath); if(!sx) throw new Error('zip');
  var sst = [], ssx = await zipGet(buf, files, 'xl/sharedStrings.xml');
  if(ssx){
    var sis = parse(ssx).getElementsByTagName('si');
    for(var a = 0; a < sis.length; a++){ var ts = sis[a].getElementsByTagName('t'), txt = ''; for(var b = 0; b < ts.length; b++) txt += ts[b].textContent; sst.push(txt); }
  }
  var rowEls = parse(sx).getElementsByTagName('row'), out = [];
  for(var r = 0; r < rowEls.length; r++){
    var cells = rowEls[r].getElementsByTagName('c'), arr = [], rn = parseInt(rowEls[r].getAttribute('r'), 10) || (out.length + 1);
    for(var k = 0; k < cells.length; k++){
      var c = cells[k], ci = colIdx(c.getAttribute('r')); if(ci < 0) ci = arr.length;
      var t = c.getAttribute('t'), vEl = c.getElementsByTagName('v')[0], val = '';
      if(t === 's') val = vEl ? (sst[+vEl.textContent] || '') : '';
      else if(t === 'inlineStr'){ var its = c.getElementsByTagName('t'); for(var m = 0; m < its.length; m++) val += its[m].textContent; }
      else if(t === 'str') val = vEl ? vEl.textContent : '';
      else if(t === 'b') val = vEl ? (vEl.textContent === '1' ? '1' : '0') : '';
      else if(t === 'e') val = '';
      else if(vEl && vEl.textContent !== ''){ var nn = parseFloat(vEl.textContent); val = isNaN(nn) ? vEl.textContent : nn; }
      arr[ci] = val;
    }
    for(var z = 0; z < arr.length; z++) if(arr[z] === undefined) arr[z] = '';

  }

function readAB(file){ return new Promise(function(res, rej){ var fr = new FileReader(); fr.onload = function(){ res(fr.result); }; fr.onerror = function(){ rej(new Error('read')); }; fr.readAsArrayBuffer(file); }); }

  var u = cur(); if(!u) return;
  modal('Hesabım',
    '<div class="hint"><b>' + esc(u.name) + '</b> · ' + esc(u.username) + ' · ' + (u.role === 'admin' ? 'Yönetici' : 'Personel') + '</div>' +
    '<div class="row-end" style="justify-content:flex-start;margin:0 0 14px"><button type="button" class="btn danger" data-act="logout">Oturumu kapat</button><button type="button" class="btn" data-act="theme">Tema değiştir</button></div>' +
    '<h3 style="font-size:15px">Şifre değiştir</h3>' +
    fld('Mevcut şifre', '<input name="cp" type="password" autocomplete="current-password">') +
    '<div class="cols">' + fld('Yeni şifre', '<input name="np" type="password" autocomplete="new-password">') + fld('Yeni şifre (tekrar)', '<input name="np2" type="password" autocomplete="new-password">') + '</div>',
    function(f){
      if(!f.cp && !f.np && !f.np2) return true;
      (async function(){
        if((await hashPw(f.cp, u.salt)) !== u.hash){ toast('Mevcut şifre hatalı', 'err'); return; }
        if(f.np.length < 4){ toast('Yeni şifre en az 4 karakter olmalı', 'err'); return; }
        if(f.np !== f.np2){ toast('Yeni şifreler aynı değil', 'err'); return; }
        u.salt = newSalt(); u.hash = await hashPw(f.np, u.salt);
        closeModal(); commit(); toast('Şifre değiştirildi');
      })();
      return false;
    }, 'Şifreyi kaydet');
};
A.logout = function(){ setSess(''); state.ed = {sale:null, purchase:null}; state.cariId = null; state.tab = 'panel'; closeModal(); render(); };

/* ---------- Giriş ve ilk kurulum ---------- */
var loginTries = 0, lockUntil = 0;
function loginView(){
  return '<div class="card login">' + logoBlock() + '<h2>' + esc((db.settings && db.settings.name) || 'Stok ve Cari Takip') + '</h2><p class="muted" style="margin-top:4px">Devam etmek için giriş yapın.</p>' +
    '<form id="lf">' + fld('Kullanıcı adı', '<input name="u" autocomplete="username" autocapitalize="none" required>') + fld('Şifre', '<input name="p" type="password" autocomplete="current-password" required>') +
    '<div class="err-t" id="lerr"></div><button class="btn pri" style="width:100%">Giriş yap</button></form></div>';
}
function setupView(){
  return '<div class="card login">' + logoBlock() + '<h2>İlk kurulum</h2><p class="muted" style="margin-top:4px">Yönetici hesabını oluşturun. Mevcut kayıtlarınız varsa korunur.</p>' +
    '<form id="sf">' + fld('İşletme adı', '<input name="biz" placeholder="İsteğe bağlı">') + fld('Ad soyad', '<input name="fn" required>') + fld('Kullanıcı adı', '<input name="u" autocomplete="username" autocapitalize="none" required>') +
    '<div class="cols">' + fld('Şifre', '<input name="p" type="password" autocomplete="new-password" required>') + fld('Şifre (tekrar)', '<input name="p2" type="password" autocomplete="new-password" required>') + '</div>' +
    '<div class="err-t" id="lerr"></div><button class="btn pri" style="width:100%">Kurulumu tamamla</button></form>' +
    '<div class="muted" style="margin:16px 0 8px;text-align:center">Başka bir cihazdaki kayıtlarınızı taşıyorsanız</div>' +
    '<label class="btn" style="display:block;text-align:center;cursor:pointer;margin:0">Yedek dosyasından başla<input type="file" id="bkfile2" accept=".json,application/json,text/plain" style="display:none"></label></div>';
}
document.addEventListener('submit', function(e){
  var f = e.target;
  if(f.id === 'lf'){ e.preventDefault(); doLogin(f); }
  else if(f.id === 'sf'){ e.preventDefault(); doSetup(f); }
});
async function doLogin(f){
  var err = $('#lerr'), wait = lockUntil - Date.now();
  if(wait > 0){ err.textContent = 'Çok fazla hatalı deneme. ' + Math.ceil(wait / 1000) + ' saniye sonra tekrar deneyin.'; return; }
  var E = f.elements, un = E.u.value.trim().toLowerCase(), pw = E.p.value;
  var u = db.users.find(function(x){ return x.username === un && x.active !== false; });
  var ok = false;
  if(u) ok = (await hashPw(pw, u.salt)) === u.hash;
  if(!ok){
    loginTries++; if(loginTries >= 5){ lockUntil = Date.now() + 30000; loginTries = 0; }
    err.textContent = 'Kullanıcı adı veya şifre hatalı'; E.p.value = ''; return;
  }
  loginTries = 0; setSess(u.id); state.tab = 'panel'; render(); toast('Hoş geldiniz, ' + u.name);
}
async function doSetup(f){
  var E = f.elements, err = $('#lerr'), nm = E.fn.value.trim(), un = E.u.value.trim().toLowerCase(), pw = E.p.value;
  if(!nm || !un){ err.textContent = 'Ad ve kullanıcı adı girin'; return; }
  if(/\s/.test(un)){ err.textContent = 'Kullanıcı adında boşluk olamaz'; return; }
  if(pw.length < 4){ err.textContent = 'Şifre en az 4 karakter olmalı'; return; }
  if(pw !== E.p2.value){ err.textContent = 'Şifreler aynı değil'; return; }
  var salt = newSalt();
  var u = {id:uid(), name:nm, username:un, role:'admin', active:true, salt:salt, hash:await hashPw(pw, salt), created:today()};
  db.users.push(u);
  if(E.biz.value.trim()) db.settings.name = E.biz.value.trim();
  setSess(u.id); commit(); toast('Kurulum tamamlandı');
}

/* ---------- Uygulama gibi kurulum (PWA) ---------- */
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
ensureUserPerms();
render();
</script>
