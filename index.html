<style>

    --danger:#ff7b82;--danger-soft:#3d1a1d;--warn:#f1c453;--warn-soft:#3a2f0e;

  }
}

<header>
  <div class="top">
    <button id="menubtn" class="menubtn" data-act="toggleNav" aria-label="Menüyü aç veya kapat">☰</button>
    <span id="logo"></span><div class="brand"><span id="biz">Stok ve Cari Takip</span><small>Satış, alış, stok ve cari hesaplar</small></div><span id="usr"></span>
    <span class="spacer"></span>
  </div>
</header>
<div class="shell"><nav id="nav" aria-label="Menü"></nav><main id="app"></main></div>
<div id="navbk" data-act="toggleNav"></div>
<div class="modal" id="modal" hidden></div>
<div id="toast" hidden></div>

<script>
/* ---------- Veri ---------- */
var KEY = 'stokcari_v1';
var APP_VERSION = '2026.10.25-8';
function defaults(){ return {products:[],caris:[],docs:[],payments:[],moves:[],counters:{sale:0,purchase:0},seq:1,users:[],campaigns:[],rates:[],settings:{name:'',phone:'',address:'',taxNo:'',footer:'',logo:'',logoRcpt:false,attrVals:[[],[],[],[],[]]}}; }
function load(){
  try{ var s = localStorage.getItem(KEY); if(s){ var o = JSON.parse(s); return Object.assign(defaults(), o); } }catch(e){}
  return defaults();
}
var db = load();
ensureAttrVals();
function save(){ if(SRV){ scheduleSync(); return; } try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ toast('Veri kaydedilemedi. Tarayıcı depolama alanı dolu olabilir, yedek alın.', 'err'); } }
function uid(){ return 'i' + (db.seq++).toString(36) + Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2, 6); }

/* ---------- Oturum ve yetki ---------- */
var SESS = 'stokcari_sess';
var sessId = '';
try{ sessId = sessionStorage.getItem(SESS) || ''; }catch(e){}
function cur(){ return db.users.find(function(u){ return u.id === sessId && u.active !== false; }); }
function setSess(id){ sessId = id || ''; try{ if(id) sessionStorage.setItem(SESS, id); else sessionStorage.removeItem(SESS); }catch(e){} }
/* Menü ve işlem bazlı yetkiler. Yönetici rolü her şeye sahiptir; personelin yetkileri kullanıcı bazında seçilir. */
var PERMS = [
  {id:'panel', label:'Panel', items:[['view', 'Menüyü görebilir'], ['cash', 'Kasa bilgilerini görebilir (kasa, bugünkü kasa)']]},
  {id:'sales', label:'Satış', items:[['view', 'Menüyü ve geçmiş satışları görebilir'], ['new', 'Yeni satış yapabilir'], ['discount', 'İskonto girebilir (satır ve genel)'], ['price', 'Satışta birim fiyatı değiştirebilir'], ['refund', 'Satış iadesi yapabilir'], ['delete', 'Satış ve satış iadesi kaydını silebilir']]},
  {id:'purchases', label:'Alış', items:[['view', 'Menüyü ve geçmiş alışları görebilir'], ['new', 'Yeni alış yapabilir'], ['refund', 'Alış iadesi yapabilir'], ['delete', 'Alış ve alış iadesi kaydını silebilir']]},
  {id:'products', label:'Ürünler', items:[['view', 'Menüyü ve ürün kartlarını görebilir'], ['edit', 'Ürün ekleyip düzenleyebilir'], ['delete', 'Ürün silebilir'], ['import', 'Excel’den toplu aktarım yapabilir'], ['labels', 'Barkod ve etiket işlemleri yapabilir (etiket, toplu etiket, otomatik barkod)']]},
  {id:'attrs', label:'Özellikler', items:[['view', 'Menüyü görebilir'], ['edit', 'Özellik adlarını ve değerlerini değiştirebilir']]},
  {id:'campaigns', label:'Kampanyalar', items:[['view', 'Menüyü görebilir'], ['edit', 'Kampanya ekleyip düzenleyebilir, silebilir']]},
  {id:'stock', label:'Stok', items:[['view', 'Menüyü, stok ve hareketleri görebilir'], ['move', 'Elle stok girişi ve çıkışı yapabilir'], ['delete', 'Elle girilmiş stok hareketini silebilir']]},

function syncPay(ed, t){

    var o = ed.ref ? origDoc(ed.ref) : null, km = {'Nakit':'n', 'Kredi kartı':'k', 'Havale / EFT':'h'};
    ed.pay = {n:'', k:'', h:''};

      Object.keys(op).forEach(function(m){
        var k = km[m] || 'n', v = Math.min(left, r2(op[m] * ratio));
        if(v > 0){ ed.pay[k] = String(r2(num(ed.pay[k]) + v)); left = r2(left - v); }

  }
  if(ed.pm){
    ['n', 'k', 'h'].forEach(function(k){
      if(k !== ed.pm || !t){ ed.pay[k] = ''; return; }
      var c = ed.pc[k] || 'TRY', r = docRate(ed, c);
      ed.pay[k] = c === 'TRY' ? t : (r > 0 ? r2(t / r) : '');   // dövizle ödemede tutar = fiş tutarı / kur

/* Ödeme hesabı: alınan tutarlar (her biri kendi para biriminde), para üstü ve kalan.

function payCalc(ed, total){
  fxEnsure(ed);
  var T = [], tend = 0, cash = 0, tol = 0.004;
  [['n', 'Nakit'], ['k', 'Kredi kartı'], ['h', 'Havale / EFT']].forEach(function(kv){
    var a = r2(num(ed.pay[kv[0]])); if(!(a > 0)) return;
    var c = ed.pc[kv[0]] || 'TRY', r = docRate(ed, c), tl = r2(a * r);
    T.push({k:kv[0], m:kv[1], c:c, a:a, r:r, tl:tl});
    tend += tl; if(kv[0] === 'n') cash += tl;
    if(c !== 'TRY') tol += 0.005 * r;
  });
  var cashT = T.filter(function(t){ return t.k === 'n'; })[0];
  var chc = ed.chc || (cashT ? cashT.c : 'TRY'), cr = docRate(ed, chc);      // para üstü: seçilmediyse alınan nakdin para biriminde
  if(chc !== 'TRY') tol += 0.005 * cr;
  var out = {tender:T, tendTL:r2(tend), cashTL:r2(cash), total:total, change:null, paidNet:0, rest:0, err:''};
  var missing = T.some(function(t){ return t.c !== 'TRY' && !(t.r > 0); });
  if(missing){ out.err = 'Seçilen para birimi için kur yok'; out.paidNet = 0; out.rest = total; return out; }
  var diff = r2(tend - total);
  if(Math.abs(diff) <= tol) out.paidNet = total;
  else if(diff > 0){
    if(!(cr > 0)){ out.err = chc + ' kuru yok'; out.paidNet = total; return out; }
    var ca = r2(diff / cr), ctl = r2(ca * cr), net = r2(tend - ctl);
    out.change = {c:chc, a:ca, r:cr, tl:ctl};
    out.paidNet = Math.abs(net - total) <= tol ? total : Math.min(net, total);
    if(diff > cash + tol) out.err = 'Para üstü yalnızca nakit alınan tutardan verilebilir (kart veya havale tutarı fiş tutarını aşıyor)';
  } else { out.paidNet = r2(tend); out.rest = r2(total - tend); }
  return out;
}

/* Ortalama alış maliyeti: alış belgelerindeki net birim maliyetlerin miktarla ağırlıklı ortalaması (alış iadeleri düşülür).
   Hiç alış yapılmamış ürünlerde (örn. yalnızca açılış stoğu) ürün kartındaki alış fiyatı kullanılır. Tutarlar KDV dahildir. */
function avgCostMap(){
  var tq = {}, ta = {};
  db.docs.forEach(function(d){
    if(d.type !== 'purchase' && d.type !== 'pret') return;
    var sg = d.type === 'purchase' ? 1 : -1;
    d.lines.forEach(function(l){ var q = num(l.qty); if(!(q > 0)) return; tq[l.pid] = (tq[l.pid] || 0) + sg * q; ta[l.pid] = (ta[l.pid] || 0) + sg * lt(l); });
  });
  var out = {};
  db.products.forEach(function(p){ out[p.id] = tq[p.id] > 0.0001 ? Math.round(ta[p.id] / tq[p.id] * 10000) / 10000 : (Number(p.cost) || 0); });
  return out;
}
/* Satış satırlarının maliyeti (kâr hesabı): satış tarihine kadarki alışların ağırlıklı ortalaması (hareketli ortalama, indirimler düşülmüş, KDV dahil).
   Sonradan yapılan alışlar eski satışların kârını değiştirmez. O güne kadar alış yoksa (örn. açılış stoğu satıldı) satırda kayıtlı maliyet kullanılır.
   Bağlı satış iadesi, ilk satışın maliyetiyle; bağlantısız iade, iade gününün ortalamasıyla hesaplanır. */
function saleCosts(){
  var cost = new Map(), tq = {}, ta = {}, byId = {};
  var docs = db.docs.slice().sort(function(a, b){ return a.date.localeCompare(b.date) || (a.ts || 0) - (b.ts || 0); });
  docs.forEach(function(d){ byId[d.id] = d; });
  var avg = function(pid, fb){ return tq[pid] > 0.0001 ? ta[pid] / tq[pid] : fb; };
  docs.forEach(function(d){
    if(d.type === 'purchase' || d.type === 'pret'){
      var sg = d.type === 'purchase' ? 1 : -1;
      d.lines.forEach(function(l){ var q = num(l.qty); if(!(q > 0)) return; tq[l.pid] = (tq[l.pid] || 0) + sg * q; ta[l.pid] = (ta[l.pid] || 0) + sg * lt(l); });
    } else if(d.type === 'sale'){
      d.lines.forEach(function(l){ cost.set(l, avg(l.pid, Number(l.cost) || 0)); });
    } else if(d.type === 'sret'){

        if(od){ var ol = od.lines.find(function(x){ return x.pid === l.pid && nv(x.cl) === nv(l.cl) && nv(x.sz) === nv(l.sz); }); if(ol && cost.has(ol)) c = cost.get(ol); }

function cpApply(c, f){                                       // formdaki fiyat türü ve özel fiyatları cariye yazar; boşsa alanlar hiç oluşmaz

  });

  if(Object.keys(np).length) c.prices = np; else delete c.prices;
}

/* Satış fiyatı: cari kartındaki özel fiyat, yoksa cari fiyat türü (toptan), carisiz satışta seçilen tür; hiçbiri yoksa perakende */
function unitPrice(p, cariId, kind){
  var c = cariId ? cari(cariId) : null;
  if(c){
    var sp = c.prices && c.prices[p.id];
    if(sp != null && sp !== '' && Number(sp) > 0) return Number(sp);
    kind = c.ptype === 'wholesale' ? 'wholesale' : 'retail';
  }
  if(kind === 'wholesale' && Number(p.wprice) > 0) return Number(p.wprice);
  return Number(p.price) || 0;
}
function lineDefault(type, ed, p){ return TYPES[type].sellSide ? unitPrice(p, ed.cariId, ed.pk) : p.cost; }
function reprice(type, ed){                                   // elle fiyat girilmemiş satırları güncel fiyat kaynağına göre yeniler
  if(!TYPES[type].sellSide || ed.ref) return 0;
  var n = 0;
  ed.lines.forEach(function(l){
    if(!l.pid || l.pm) return;
    var p = prod(l.pid); if(!p) return;
    var np = unitPrice(p, ed.cariId, ed.pk), fxd = ed.cur && ed.cur !== 'TRY';
    if(num(fxd ? l.lp : l.price) !== np){ if(fxd) l.lp = np; else l.price = np; n++; }
  });
  return n;
}
function priceField(type, ed){
  if(!TYPES[type].sellSide) return '';
  if(ed.ref) return fld('Fiyat', '<input value="Bağlı belgedeki fiyatlar" disabled>');
  if(ed.cariId){
    var c = cari(ed.cariId), n = c && c.prices ? Object.keys(c.prices).length : 0;
    return fld('Fiyat (cari kartından)', '<input value="' + esc((c && c.ptype === 'wholesale' ? 'Toptan' : 'Perakende') + (n ? ' · ' + n + ' özel fiyat' : '')) + '" disabled>');
  }
  return fld('Fiyat türü', '<select data-ed="' + type + '" data-f="pk"><option value="retail"' + (ed.pk !== 'wholesale' ? ' selected' : '') + '>Perakende</option><option value="wholesale"' + (ed.pk === 'wholesale' ? ' selected' : '') + '>Toptan</option></select>');
}

A.saveDoc = async function(d){
  var type = d.type, ed = state.ed[type];
  if(!can(DOC_PERM[type])){ toast('Bu işlem için yetkiniz yok', 'err'); return; }
  if(type === 'sale'){
    if(!can('sales.discount')){ ed.lines.forEach(function(l){ l.disc = null; }); ed.docDisc = null; }
    if(!can('sales.price')){ ed.lines.forEach(function(l){ var p0 = prod(l.pid); if(p0) l.price = unitPrice(p0, ed.cariId, ed.pk); }); }
  }
  var vbad = null;
  ed.lines.forEach(function(l, i){
    if(vbad || !l.pid || !(num(l.qty) > 0)) return;
    var p = prod(l.pid); if(!p) return;
    if(!hasVar(p)){ l.cl = ''; l.sz = ''; return; }
    var vb = vbits(p), who = 'Satır ' + (i + 1) + ' (' + p.name + '): ';
    if(vb.c.length && !l.cl) vbad = who + 'renk seçin';
    else if(vb.s.length && !l.sz) vbad = who + 'beden seçin';
    else if((vb.c.length && vb.c.indexOf(l.cl) < 0) || (vb.s.length && vb.s.indexOf(l.sz) < 0)) vbad = who + 'renk veya beden bu üründe tanımlı değil';
    else { if(!vb.c.length) l.cl = ''; if(!vb.s.length) l.sz = ''; }
  });
  if(vbad){ toast(vbad, 'err'); return; }
  fxEnsure(ed, type); fxLines(ed);
  var pr = edPricing(type, ed);
  syncPay(ed, pr.total);
  if(!pr.lines.length){ toast('En az bir ürün ve miktar girin', 'err'); return; }
  var total = pr.total, pc = payCalc(ed, total);
  if(pc.err){ toast(pc.err, 'err'); return; }
  var need = {};
  if(ed.cur !== 'TRY') need[ed.cur] = 1;
  pc.tender.forEach(function(x){ if(x.c !== 'TRY') need[x.c] = 1; });
  if(pc.change && pc.change.c !== 'TRY') need[pc.change.c] = 1;
  if(Object.keys(need).length && !fxOn()){ toast('Dövizli işlem yapma yetkiniz yok', 'err'); return; }
  var miss = Object.keys(need).find(function(c){ return !(docRate(ed, c) > 0); });
  if(miss){ toast(miss + ' kuru yok. ' + (can('fx.rate') ? 'Kuru elle yazın ya da Ayarlar > Döviz ve kurlar bölümünden kurları güncelleyin.' : 'Yöneticinizden kurları güncellemesini isteyin.'), 'err'); return; }
  var paid = pc.paidNet, pays = {};
  pc.tender.forEach(function(x){ pays[x.m] = r2((pays[x.m] || 0) + x.tl); });
  if(pc.change) pays['Nakit'] = r2((pays['Nakit'] || 0) - pc.change.tl);
  var padj = r2(paid - sum(Object.keys(pays), function(m){ return pays[m]; }));      // kuruş yuvarlaması: nakit tutarı ödenene eşitlenir
  if(padj){ var pmk = pays['Nakit'] !== undefined ? 'Nakit' : Object.keys(pays)[0]; if(pmk) pays[pmk] = r2((pays[pmk] || 0) + padj); }
  Object.keys(pays).forEach(function(m){ if(!(pays[m] > 0)) delete pays[m]; });
  var fx = {};
  if(Object.keys(need).length){
    var fxr = {}, used_ = {}; Object.keys(need).forEach(function(c){ var row = fxAuto() ? rateRow(c, ed.date || today()) : null, man = !fxAuto() || ed.rman[c]; fxr[c] = {r:docRate(ed, c), t:man ? 'man' : ed.rt, d:man ? (ed.date || today()) : (row ? row.date : (ed.date || today()))}; used_[c] = docRate(ed, c); });
    fx.fxr = fxr; fxRemember(used_);
  }
  if(ed.cur !== 'TRY'){ fx.cur = ed.cur; fx.ftotal = r2(total / docRate(ed, ed.cur)); }
  if(pc.tender.some(function(x){ return x.c !== 'TRY'; }) || pc.change){
    fx.tnd = pc.tender.map(function(x){ return {m:x.m, c:x.c, a:x.a, tl:x.tl}; });
    if(pc.change) fx.chg = {c:pc.change.c, a:pc.change.a, tl:pc.change.tl};
  }
  if(!ed.cariId && paid < total - 0.004){ toast('Cari seçmeden kalan tutar bırakılamaz. Cari seçin ya da tamamını ödeme olarak girin.', 'err'); return; }
  if(ed.ref && (type === 'sret' || type === 'pret')){
    var byp = {};
    pr.lines.forEach(function(l){ var k = vkey(l); byp[k] = (byp[k] || 0) + l.qty; });
    var bad = Object.keys(byp).find(function(k){ var a = k.split('|'); return byp[k] > remainingQty(ed.ref, a[0], a[1], a[2]) + 0.0001; });
    if(bad){ var ba = bad.split('|'); toast('İade miktarı kalan iade edilebilir miktarı aşıyor: ' + ((prod(ba[0]) || {}).name || '') + (ba[1] || ba[2] ? ' (' + varLabel(ba[1], ba[2]) + ')' : '') + ' (en fazla ' + qf(remainingQty(ed.ref, ba[0], ba[1], ba[2])) + ')', 'err'); return; }
  }
  var rno = null;
  if(SRV){ try{ rno = (await api('POST', '/api/reserve', {type:type})).no; }catch(e){ if(e.status === 401) srvLogout('Oturum süresi doldu, yeniden giriş yapın'); else toast(e.message || 'Belge numarası alınamadı, bağlantıyı kontrol edin', 'err'); return; } }
  var nd = createDoc({type:type, no:rno, date:ed.date || today(), cariId:ed.cariId, lines:ed.lines, docDisc:ed.docDisc, pays:pays, note:ed.note, ref:ed.ref, cur:fx.cur, ftotal:fx.ftotal, fxr:fx.fxr, tnd:fx.tnd, chg:fx.chg});
  state.ed[type] = null; commit(); toast(KIND[type] + ' kaydedildi');
  if(type === 'sale' || type === 'sret') A.receipt({kind:'doc', id:nd.id});
};

A.saveStock = function(){
  var ed = state.ed.stock; if(!ed) return;
  if(!can('stockmove')){ toast('Bu işlem için yetkiniz yok', 'err'); return; }
  var out = ed.dir === 'out', items = [], bad = null;
  ed.lines.forEach(function(l, i){
    if(bad || !l.pid) return;                                     // ürün seçilmemiş satırlar atlanır
    var p = prod(l.pid); if(!p) return;
    var who = 'Satır ' + (i + 1) + ' (' + p.name + '): ', q = num(l.qty), cl = l.cl || '', sz = l.sz || '';
    if(!(q > 0)){ bad = who + 'miktar girin'; return; }
    if(hasVar(p)){
      var vb = vbits(p), none = !cl && !sz;
      if(none){ if(!(Math.abs(stockV(p.id, '', '')) > 0.0001)){ bad = who + 'renk ve beden seçin'; return; } }
      else if((vb.c.length && !cl) || (vb.s.length && !sz)){ bad = who + 'renk ve beden seçin'; return; }
      else if((vb.c.length && vb.c.indexOf(cl) < 0) || (vb.s.length && vb.s.indexOf(sz) < 0)){ bad = who + 'renk veya beden bu üründe tanımlı değil'; return; }
    } else { cl = ''; sz = ''; }
    items.push({p:p, q:q, cl:cl, sz:sz});
  });
  if(bad){ toast(bad, 'err'); return; }
  if(!items.length){ toast('En az bir ürün ve miktar girin', 'err'); return; }
  var ts = Date.now(), by = (cur() || {}).id || '', note = String(ed.note || '').trim();
  items.forEach(function(it, k){
    var mv = {id:uid(), pid:it.p.id, qty:out ? -it.q : it.q, date:ed.date || today(), reason:ed.reason, note:note, by:by, ts:ts + k};
    if(it.cl) mv.cl = it.cl; if(it.sz) mv.sz = it.sz;
    db.moves.push(mv);
  });
  state.ed.stock = null; commit(); toast(items.length + ' satır stok ' + (out ? 'çıkışı' : 'girişi') + ' kaydedildi');
};

function restoreBackup(txt, skipConfirm){

  if(!o || !Array.isArray(o.products) || !Array.isArray(o.docs)){ toast('Bu dosya geçerli bir yedek değil', 'err'); return; }
  var go = function(){ db = Object.assign(defaults(), o); ensureAttrVals(); ensureUserPerms(); if(!cur()) setSess(''); commit(); toast('Yedek yüklendi'); };

function readBackupFile(file, fromSetup){
  if(!file) return;
  if(file.size > 30 * 1024 * 1024){ toast('Dosya çok büyük', 'err'); return; }
  var fr = new FileReader();
  fr.onerror = function(){ toast('Dosya okunamadı', 'err'); };
  fr.onload = function(){
    var txt = String(fr.result || '');
    if(fromSetup) restoreBackup(txt, !(db.products.length || db.docs.length));
    else { var ta = $('#bk'); if(ta) ta.value = txt; restoreBackup(txt, false); }
  };
  fr.readAsText(file);
}

function catClean(f){

}
function catClash(arr, c, d, self){                              // kod ve açıklamalar tek havuzda benzersiz olmalı (Excel eşleştirmesi belirsiz kalmasın)
  for(var j = 0; j < arr.length; j++){
    if(j === self) continue; var x = arr[j];
    if(lk(x.c) === lk(c)) return 'Bu kod zaten tanımlı';
    if(lk(x.d) === lk(c)) return 'Bu kod, başka bir değerin açıklamasıyla aynı (' + x.d + ')';
    if(lk(x.c) === lk(d) || lk(x.d) === lk(d)) return 'Bu açıklama zaten kullanılıyor (' + d + ')';
  }
  return '';
}
function catAddOne(kind, f){                                      // ortak ekleme: {ok, code} veya {err}

}
function catForm(kind, k){

          db.products.forEach(function(p){
            if(Array.isArray(p[key])) p[key] = p[key].map(function(x){ return lk(x) === lk(old) ? n.c : x; });
            var m = vbcOf(p), ks = Object.keys(m);
            if(ks.length){ var nm2 = {}; ks.forEach(function(kk){ var ab = kk.split('|'); if(lk(ab[pos]) === lk(old)) ab[pos] = n.c; nm2[ab.join('|')] = m[kk]; }); p.vbc = nm2; }

function valForm(i, k){
  var v = k != null ? attrVals(i)[k] : null;
  modal((v ? 'Değeri düzenle' : 'Yeni değer') + ' · ' + attrNames()[i],
    '<div class="cols">' + fld('Kod', '<input name="c" required value="' + esc(v ? v.c : '') + '" placeholder="Örn. CAY">') + fld('Açıklama', '<input name="d" value="' + esc(v ? v.d : '') + '" placeholder="Örn. Çay ürünleri">') + '</div>',
    function(f){
      var c = f.c.trim(), d = f.d.trim();
      if(!c){ toast('Kod girin', 'err'); return false; }
      ensureAttrVals();
      var arr = db.settings.attrVals[i];
      if(arr.some(function(x, j){ return x.c.toLowerCase() === c.toLowerCase() && j !== k; })){ toast('Bu kod bu özellikte zaten var', 'err'); return false; }
      if(k != null){
        var t = arr[k], old = t.c;
        if(old !== c){
          db.products.forEach(function(p){ if((p.attrs || [])[i] === old) p.attrs[i] = c; });
          db.campaigns.forEach(function(cm){
            if(cm.scope !== 'attr') return;

          });
        }

      arr.sort(function(a, b){ return a.c.localeCompare(b.c, 'tr'); });
      commit(); toast('Değer kaydedildi');
    });
}

function loadLogo(file){
  if(!file) return;
  if(file.size > 8 * 1024 * 1024){ toast('Dosya çok büyük (en fazla 8 MB)', 'err'); return; }
  var fr = new FileReader();
  fr.onerror = function(){ toast('Dosya okunamadı', 'err'); };
  fr.onload = function(){
    var img = new Image();
    img.onerror = function(){ toast('Bu görsel açılamadı. PNG veya JPG deneyin.', 'err'); };
    img.onload = function(){
      try{
        var iw = img.width || 300, ih = img.height || 100;
        var sc = Math.min(1, 360 / Math.max(iw, ih));
        var cw = Math.max(1, Math.round(iw * sc)), ch = Math.max(1, Math.round(ih * sc));
        var cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
        cv.getContext('2d').drawImage(img, 0, 0, cw, ch);
        var url = cv.toDataURL('image/png');
        if(url.length > 300000){
          var c2 = document.createElement('canvas'); c2.width = cw; c2.height = ch;
          var x2 = c2.getContext('2d'); x2.fillStyle = '#fff'; x2.fillRect(0, 0, cw, ch); x2.drawImage(img, 0, 0, cw, ch);
          url = c2.toDataURL('image/jpeg', 0.85);
        }
        if(!/^data:image\//.test(url)){ toast('Logo işlenemedi', 'err'); return; }
        db.settings.logo = url; commit(); toast('Logo kaydedildi');
      }catch(e){ toast('Logo işlenemedi', 'err'); }
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}
A.rmLogo = function(){ db.settings.logo = ''; commit(); toast('Logo kaldırıldı'); };

function nz(x){ return String(x == null ? '' : x).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/ı/g, 'i').replace(/[^a-z0-9]/g, ''); }
function tx(v){ if(typeof v === 'number') return Number.isInteger(v) ? v.toFixed(0) : String(v); return String(v == null ? '' : v).trim(); }
function pNum(v){
  if(typeof v === 'number') return isFinite(v) ? v : NaN;
  var t = String(v == null ? '' : v).trim().replace(/[₺%\s]|TL|tl|TRY/g, '');
  if(t === '') return null;
  var c = t.lastIndexOf(','), d = t.lastIndexOf('.');
  if(c >= 0 && d >= 0) t = c > d ? t.replace(/\./g, '').replace(',', '.') : t.replace(/,/g, '');
  else if(c >= 0) t = t.replace(/\./g, '').replace(',', '.');
  else if(d >= 0 && /^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');
  var n = Number(t);

}
function parseDelimited(text){
  text = String(text).replace(/^\uFEFF/, '');
  var first = text.split(/\r?\n/)[0] || '', best = '\t', bc = -1;
  ['\t', ';', ','].forEach(function(dl){ var n = first.split(dl).length - 1; if(n > bc){ bc = n; best = dl; } });
  var rows = [], row = [], cell = '', q = false;
  for(var i = 0; i < text.length; i++){
    var ch = text[i];
    if(q){ if(ch === '"'){ if(text[i + 1] === '"'){ cell += '"'; i++; } else q = false; } else cell += ch; }
    else if(ch === '"' && cell === ''){ q = true; }
    else if(ch === best){ row.push(cell); cell = ''; }
    else if(ch === '\n' || ch === '\r'){ if(ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if(cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows;
}

/* .xlsx okuyucu: zip + XML, harici kütüphane gerektirmez */
function zipIndex(buf){
  var u8 = new Uint8Array(buf), dv = new DataView(buf), e = -1, i;
  for(i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--){ if(dv.getUint32(i, true) === 0x06054b50){ e = i; break; } }
  if(e < 0) throw new Error('zip');
  var n = dv.getUint16(e + 10, true), p = dv.getUint32(e + 16, true), files = {};
  for(var k = 0; k < n; k++){
    if(dv.getUint32(p, true) !== 0x02014b50) throw new Error('zip');
    var nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
    var name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nl));
    files[name] = {method:dv.getUint16(p + 10, true), csize:dv.getUint32(p + 20, true), lho:dv.getUint32(p + 42, true)};
    p += 46 + nl + el + cl;
  }
  return files;
}
async function zipGet(buf, files, name){
  var f = files[name]; if(!f) return null;
  var dv = new DataView(buf), u8 = new Uint8Array(buf), p = f.lho;
  var start = p + 30 + dv.getUint16(p + 26, true) + dv.getUint16(p + 28, true);
  var data = u8.subarray(start, start + f.csize);
  if(f.method === 0) return data;
  if(f.method !== 8) throw new Error('zip');
  var rs = new ReadableStream({start:function(c){ c.enqueue(data); c.close(); }}).pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(rs).arrayBuffer());
}
function colIdx(ref){ var m = /^([A-Za-z]+)/.exec(ref || ''); if(!m) return -1; var t = m[1].toUpperCase(), n = 0; for(var i = 0; i < t.length; i++) n = n * 26 + (t.charCodeAt(i) - 64); return n - 1; }
async function readXlsx(buf){
  if(typeof DecompressionStream === 'undefined') throw new Error('nostream');
  var files = zipIndex(buf), dec = new TextDecoder('utf-8'), parse = function(u){ return new DOMParser().parseFromString(dec.decode(u), 'application/xml'); };
  var sheetPath = 'xl/worksheets/sheet1.xml';
  var wbx = await zipGet(buf, files, 'xl/workbook.xml'), rels = await zipGet(buf, files, 'xl/_rels/workbook.xml.rels');
  if(wbx && rels){
    var sh = parse(wbx).getElementsByTagName('sheet')[0], rid = sh && sh.getAttribute('r:id'), rs = parse(rels).getElementsByTagName('Relationship');
    for(var i = 0; i < rs.length; i++){ if(rid && rs[i].getAttribute('Id') === rid){ var tg = rs[i].getAttribute('Target'); sheetPath = tg.charAt(0) === '/' ? tg.slice(1) : 'xl/' + tg; } }
  }
  var sx = await zipGet(buf, files, sheetPath); if(!sx) throw new Error('zip');
  var sst = [], ssx = await zipGet(buf, files, 'xl/sharedStrings.xml');
  if(ssx){
    var sis = parse(ssx).getElementsByTagName('si');
    for(var a = 0; a < sis.length; a++){ var ts = sis[a].getElementsByTagName('t'), txt = ''; for(var b = 0; b < ts.length; b++) txt += ts[b].textContent; sst.push(txt); }
  }
  var rowEls = parse(sx).getElementsByTagName('row'), out = [];
  for(var r = 0; r < rowEls.length; r++){
    var cells = rowEls[r].getElementsByTagName('c'), arr = [], rn = parseInt(rowEls[r].getAttribute('r'), 10) || (out.length + 1);

function origDoc(id){ return db.docs.find(function(d){ return d.id === id; }); }
function returnedQty(origId, pid, cl, sz){
  cl = nv(cl); sz = nv(sz);
  return sum(db.docs.filter(function(d){ return d.ref === origId && (d.type === 'sret' || d.type === 'pret'); }), function(d){ return sum(d.lines.filter(function(l){ return l.pid === pid && nv(l.cl) === cl && nv(l.sz) === sz; }), function(l){ return l.qty; }); });
}
function remainingQty(origId, pid, cl, sz){
  var o = origDoc(origId); if(!o) return 0;
  cl = nv(cl); sz = nv(sz);
  var sold = sum(o.lines.filter(function(l){ return l.pid === pid && nv(l.cl) === cl && nv(l.sz) === sz; }), function(l){ return l.qty; });
  return r2(sold - returnedQty(origId, pid, cl, sz));
}
function docHasRemaining(o){ return o.lines.some(function(l){ return remainingQty(o.id, l.pid, l.cl, l.sz) > 0.0001; }); }
function docProducts(id){
  var o = origDoc(id), seen = {}, out = [];
  if(o) o.lines.forEach(function(l){ var p = prod(l.pid); if(p && !seen[p.id]){ seen[p.id] = 1; out.push(p); } });
  return out;
}
function refLabel(d){ return d.no + ' · ' + fd(d.date) + ' · ' + cariName(d.cariId) + ' · ' + money(d.total); }
function refOptions(type){
  var base = type === 'sret' ? 'sale' : 'purchase';
  return db.docs.filter(function(d){ return d.type === base && docHasRemaining(d); }).sort(function(a, b){ return b.date.localeCompare(a.date) || b.ts - a.ts; }).slice(0, 400).map(function(d){ return '<option value="' + esc(refLabel(d)) + '">'; }).join('');
}
function applyRef(type, ed){
  var o = origDoc(ed.ref);
  if(!o){ ed.ref = ''; return; }
  ed.cariId = o.cariId || '';
  var ls = [], seen = {};
  o.lines.forEach(function(l){
    var k = vkey(l); if(seen[k]) return; seen[k] = 1;
    var rem = remainingQty(o.id, l.pid, l.cl, l.sz); if(rem <= 0.0001) return;
    var tl = o.lines.filter(function(x){ return vkey(x) === k; }), q = sum(tl, function(x){ return x.qty; }), net = sum(tl, function(x){ return lt(x); });
    var row = {pid:l.pid, qty:String(rem), price:String(Math.round(net / q * 10000) / 10000), pm:true};
    if(l.cl) row.cl = l.cl; if(l.sz) row.sz = l.sz;
    ls.push(row);
  });
  ed.lines = ls.length ? ls : [{pid:'', qty:1, price:''}];
  ed.pm = 'ref';
}

  var cur = snapRows(), snap = sync.snap || {}, ops = [];
  COLLS.forEach(function(c){
    var by = {}; (db[c] || []).forEach(function(x){ by[x.id] = x; });
    Object.keys(cur[c]).forEach(function(id){ if(((snap[c] || {})[id]) !== cur[c][id]) ops.push({t:c, op:'put', row:by[id]}); });
    Object.keys(snap[c] || {}).forEach(function(id){ if(!(id in cur[c])) ops.push({t:c, op:'del', id:id}); });
  });
  Object.keys(cur.settings).forEach(function(k){ if(((snap.settings || {})[k]) !== cur.settings[k]) ops.push({t:'settings', op:'put', key:k, value:db.settings[k]}); });
  return {ops:ops, cur:cur};
}
function chunkOps(ops){                                    // belgeye bağlı stok hareketleri belgeyle aynı istekte gider
  var mv = {}, rest = [];
  ops.forEach(function(o){ if(o.t === 'moves' && o.op === 'put' && o.row.ref) (mv[o.row.ref] = mv[o.row.ref] || []).push(o); else rest.push(o); });
  var out = [], cur = [];
  rest.forEach(function(o){
    var grp = [o]; if(o.t === 'docs' && o.op === 'put' && mv[o.row.id]){ grp = grp.concat(mv[o.row.id]); delete mv[o.row.id]; }
    if(cur.length + grp.length > 1000){ out.push(cur); cur = []; }
    cur = cur.concat(grp);
  });
  Object.keys(mv).forEach(function(k){ cur = cur.concat(mv[k]); });
  if(cur.length) out.push(cur);
  return out;
}
function markSynced(o, cur){
  if(o.t === 'settings'){ sync.snap.settings[o.key] = cur.settings[o.key]; return; }
  var m = sync.snap[o.t];
  if(o.op === 'put') m[o.row.id] = cur[o.t][o.row.id]; else delete m[o.id];
}
function scheduleSync(ms){ if(!SRV || !sync.snap) return; clearTimeout(sync.timer); setSyncState('dirty'); sync.timer = setTimeout(syncNow, ms == null ? 300 : ms); }
async function syncNow(){
  if(!SRV || !sync.snap) return;
  if(sync.busy){ sync.again = true; return; }
  sync.busy = true; setSyncState('busy');
  try{
    var r = computeOps(), chunks = chunkOps(r.ops);
    for(var i = 0; i < chunks.length; i++){
      var res = await api('POST', '/api/changes', {ops:chunks[i]});
      chunks[i].forEach(function(o){ markSynced(o, r.cur); });
      if(res.prev === sync.since) sync.since = res.ver;
    }
    sync.pending = 0; sync.retry = 0; setSyncState('ok');
  }catch(e){ await syncFailed(e); }
  sync.busy = false;
  if(sync.again){ sync.again = false; scheduleSync(0); }
  else if(sync.renderPending) maybeRender();
}
async function syncFailed(e){
  if(e.status === 401){ srvLogout('Oturum süresi doldu, yeniden giriş yapın'); return; }
  if(e.status >= 400 && e.status < 500){                    // sunucu reddetti: yerel değişiklikleri geri al, sunucudaki hâle dön
    toast((e.message || 'İşlem reddedildi') + ' Değişiklik geri alındı.', 'err');
    try{ await loadSnapshot(sessId); render(); setSyncState('ok'); }catch(x){ setSyncState('err'); }
    return;
  }
  sync.pending = computeOps().ops.length; setSyncState('err');
  sync.retry = Math.min(30000, (sync.retry || 2000) * 2); clearTimeout(sync.timer); sync.timer = setTimeout(syncNow, sync.retry);
}
async function loadSnapshot(userId){
  var r = await api('GET', '/api/sync?since=0');
  var d = r.data, base = defaults();
  db = Object.assign(base, {products:d.products, caris:d.caris, docs:d.docs, payments:d.payments, moves:d.moves, campaigns:d.campaigns, rates:d.rates || [], settings:d.settings || {}, users:r.users});
  if(userId) sessId = userId;
  ensureAttrVals();                                          // yerel düzenleme; sunucuya fark olarak gönderilmez
  sync.snap = snapRows(); sync.since = r.ver; sync.pending = 0; sync.retry = 0; setSyncState('ok');
}
function canon(v){
  if(Array.isArray(v)) return v.length ? v.map(canon) : undefined;                  // boş liste ile eksik alan aynı sayılır
  if(v && typeof v === 'object'){ var o = {}; Object.keys(v).sort().forEach(function(k){ var x = canon(v[k]); if(x !== '' && x !== null && x !== undefined) o[k] = x; }); return o; }
  return v;
}
function applyRemote(r){
  var changed = false;
  COLLS.forEach(function(c){
    var arr = db[c], idx = {}; arr.forEach(function(o, i){ idx[o.id] = i; });
    (r.data[c] || []).forEach(function(o){
      var i = idx[o.id], cur = i === undefined ? null : arr[i];
      if(cur && JSON.stringify(cur) !== sync.snap[c][o.id]) return;                     // yerelde bekleyen değişiklik var
      if(cur && JSON.stringify(canon(cur)) === JSON.stringify(canon(o))){ sync.snap[c][o.id] = JSON.stringify(cur); return; }
      if(i === undefined) arr.push(o); else arr[i] = o;
      sync.snap[c][o.id] = JSON.stringify(o); changed = true;
    });
    (r.deleted[c] || []).forEach(function(id){
      var i = db[c].findIndex(function(x){ return x.id === id; });
      if(i >= 0){ if(JSON.stringify(db[c][i]) !== sync.snap[c][id]) return; db[c].splice(i, 1); changed = true; }
      delete sync.snap[c][id];
    });
  });
  Object.keys(r.data.settings || {}).forEach(function(k){
    if(db.settings[k] !== undefined && JSON.stringify(db.settings[k]) !== sync.snap.settings[k]) return;
    if(JSON.stringify(canon(db.settings[k])) === JSON.stringify(canon(r.data.settings[k]))){ sync.snap.settings[k] = JSON.stringify(db.settings[k]); return; }
    db.settings[k] = r.data.settings[k]; sync.snap.settings[k] = JSON.stringify(db.settings[k]); changed = true;
  });
  if(JSON.stringify(r.users) !== JSON.stringify(db.users)){ db.users = r.users; changed = true; }
  return changed;
}
function uiBusy(){
  var ae = document.activeElement;
  return !$('#modal').hidden || !!(state.ed.sale || state.ed.purchase || state.ed.sret || state.ed.pret || state.ed.stock) || !!(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) && $('#app').contains(ae));
}
function maybeRender(){ if(uiBusy()){ sync.renderPending = true; return; } sync.renderPending = false; render(); }
async function pollOnce(){
  if(!SRV || !sync.snap || sync.busy || document.hidden) return;
  try{
    var r = await api('GET', '/api/sync?since=' + sync.since);
    var changed = applyRemote(r); sync.since = r.ver;
    if(sync.state === 'err') setSyncState('ok');
    if(changed || sync.renderPending) maybeRender();
  }catch(e){ if(e.status === 401) srvLogout('Oturum süresi doldu, yeniden giriş yapın'); else { sync.pending = computeOps().ops.length; setSyncState('err'); } }
}
/* Giriş ekranında görünsün diye firma adı ve logo (yalnızca bu ikisi) girişsiz alınır */
async function loadBrand(){
  try{ var b = await api('GET', '/api/brand'); db.settings.name = b.name || ''; db.settings.logo = b.logo || ''; }catch(e){}
}
async function srvLogout(msg){
  try{ if(sync.snap && computeOps().ops.length) await syncNow(); }catch(e){}
  try{ await api('POST', '/api/logout', {}); }catch(e){}
  db = defaults(); sessId = ''; sync.snap = null; clearTimeout(sync.timer);
  state.ed = {sale:null, purchase:null}; state.cariId = null; state.tab = 'panel'; closeModal(); await loadBrand(); render();
  if(msg) toast(msg, 'err');
}
function serverDown(){
  document.body.classList.add('nonav');
  $('#app').innerHTML = '<div class="card login"><h2>Sunucuya ulaşılamıyor</h2>' +
    '<p class="muted" style="margin-top:4px">Verileriniz sunucudaki veritabanında duruyor, silinmedi. Bu cihazdan sunucuya şu an bağlanılamıyor. Sayfa kendiliğinden yeniden deneyecek.</p>' +
    '<ul class="muted" style="padding-left:18px;margin:8px 0 14px;line-height:1.6"><li>Sunucu bilgisayarı açık ve sunucu çalışıyor mu?</li><li>Bu cihazda Tailscale açık ve bağlı mı?</li><li>Sunucu bilgisayarında Tailscale yeniden giriş yaptıysa <b>tailscale serve status</b> çıktısını ve adresi kontrol edin.</li></ul>' +
    '<button class="btn pri" style="width:100%" data-act="retryBoot">Şimdi tekrar dene</button>' +
    '<div class="muted" style="text-align:center;font-size:12px;margin-top:14px">Sürüm ' + esc(APP_VERSION) + '</div></div>';
  clearTimeout(sync.bootTimer); sync.bootTimer = setTimeout(bootServer, 8000);
}
A.retryBoot = function(){ bootServer(); };
async function bootServer(){
  $('#app').innerHTML = '<div class="empty">Yükleniyor…</div>';
  var ping = null;
  try{
    var ctl = new AbortController(), tm = setTimeout(function(){ ctl.abort(); }, 6000);
    var r = await fetch('/api/ping', {signal:ctl.signal, cache:'no-store'}); clearTimeout(tm);
    if(r.ok){ var j = await r.json(); if(j && j.app === 'stokcari') ping = j; }
  }catch(e){ ping = null; }
  if(!ping){
    /* Bu adres daha önce sunucuyla çalıştıysa tarayıcı moduna DÜŞME: boş bir kurulum ekranı, yanlışlıkla ayrı bir hesap ve ayrı veri oluşturmaya yol açar. */
    var known = false; try{ known = localStorage.getItem('stokcari_srv') === '1'; }catch(e){}
    if(known){ serverDown(); return; }
    ensureUserPerms(); render(); return;                      // sunucu hiç görülmedi (ör. GitHub sayfası): tarayıcı modu
  }
  try{ localStorage.setItem('stokcari_srv', '1'); }catch(e){}
  clearTimeout(sync.bootTimer);
  SRV = true; SRVSETUP = !!ping.setup; sessId = ''; document.body.classList.add('srv');
  if(!SRVSETUP){ try{ var me = await api('GET', '/api/me'); await loadSnapshot(me.user.id); }catch(e){ /* oturum yok: giriş ekranı */ } }
  if(!cur()) await loadBrand();
  setInterval(pollOnce, 8000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) pollOnce(); });
  window.addEventListener('online', function(){ scheduleSync(0); pollOnce(); });
  window.addEventListener('beforeunload', function(e){ if(SRV && sync.snap && (sync.busy || computeOps().ops.length)){ e.preventDefault(); e.returnValue = ''; } });
  render();
}

/* ---------- Uygulama gibi kurulum (PWA) ---------- */
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
if(typeof fetch === 'function' && /^https?:$/.test(location.protocol)){ bootServer(); } else { ensureUserPerms(); render(); }
